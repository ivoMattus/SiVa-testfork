name: Auto-merge Dependabot PRs

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.base.ref == 'dependency-update' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect required approvals on base branch
        id: review_requirement
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.payload.pull_request.base.ref;

            try {
              const result = await github.rest.repos.getBranchProtection({
                owner,
                repo,
                branch
              });

              const requiredCount = result.data?.required_pull_request_reviews?.required_approving_review_count ?? 0;
              core.info(`Required approving review count for ${branch}: ${requiredCount}`);
              core.setOutput('needs_approval', requiredCount > 0 ? 'true' : 'false');
            } catch (error) {
              core.warning(`Could not read branch protection for ${branch}: ${error.message}`);
              core.setOutput('needs_approval', 'false');
            }

      - name: Auto-approve Dependabot PR
        if: steps.review_requirement.outputs.needs_approval == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number,
              event: 'APPROVE'
            });

            core.info(`Approved PR #${pull_number} because approvals are required.`);

      - name: Enable auto-merge (squash)
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number
            });

            if (pr.state !== 'open') {
              core.info(`PR #${pull_number} is not open; skipping.`);
              return;
            }

            const mutation = `
              mutation EnableAutoMerge($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: SQUASH
                }) {
                  pullRequest {
                    number
                    autoMergeRequest {
                      enabledAt
                    }
                  }
                }
              }
            `;

            await github.graphql(mutation, {
              pullRequestId: pr.node_id
            });

            core.info(`Enabled squash auto-merge for PR #${pull_number}.`);
