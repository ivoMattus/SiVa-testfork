name: Auto-merge Dependabot PRs

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.base.ref == 'dependency-update' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge Dependabot PR (squash)
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const maxAttempts = 3;
            const waitMs = 15000;

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const { data: pr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number
              });

              if (pr.state !== 'open') {
                return;
              }

              if (pr.mergeable === true) {
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number,
                  merge_method: 'squash',
                  sha: pr.head.sha
                });
                return;
              }

              if (attempt < maxAttempts) {
                await new Promise((resolve) => setTimeout(resolve, waitMs));
              }
            }

            core.setFailed(`PR #${pull_number} was not mergeable after ${maxAttempts} attempts.`);
