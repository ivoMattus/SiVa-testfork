name: Auto-merge Dependabot PRs

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.base.ref == 'dependency-update' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (squash)
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number
            });

            if (pr.state !== 'open') {
              core.info(`PR #${pull_number} is not open; skipping.`);
              return;
            }

            const maxAttempts = 10;
            const waitMs = 15000;

            const mutation = `
              mutation EnableAutoMerge($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: SQUASH
                }) {
                  pullRequest {
                    number
                    autoMergeRequest {
                      enabledAt
                    }
                  }
                }
              }
            `;

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              try {
                await github.graphql(mutation, {
                  pullRequestId: pr.node_id
                });

                core.info(`Enabled squash auto-merge for PR #${pull_number} on attempt ${attempt}.`);
                return;
              } catch (error) {
                const message = String(error && error.message ? error.message : error);

                if (!message.includes('Pull request is in unstable status')) {
                  throw error;
                }

                if (attempt === maxAttempts) {
                  core.setFailed(`PR #${pull_number} stayed unstable after ${maxAttempts} attempts.`);
                  return;
                }

                core.warning(`PR #${pull_number} unstable (attempt ${attempt}/${maxAttempts}); retrying in ${waitMs / 1000}s...`);
                await new Promise((resolve) => setTimeout(resolve, waitMs));
              }
            }
